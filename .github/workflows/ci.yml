name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # PR commits seguem Conventional Commits (fonte: husky/commit-msg local +
  # commitlint extends @commitlint/config-conventional). Comparação contra a
  # base do PR via merge-base do GitHub.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund
      - name: Lint commits
        run: |
          git fetch origin "${{ github.base_ref }}"
          npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

  # Push em main valida que o lib builda. Publish acontece só na tag.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund
      - name: Build lib
        run: npm run build:lib
      - name: Unit tests (design-system + workspace packages)
        run: npm test

  # Publish do registry shadcn (tag v*.*.* e push em main) roda em
  # .github/workflows/registry-pages.yml — não npm publish.
