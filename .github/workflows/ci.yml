name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # PR commits seguem Conventional Commits (fonte: husky/commit-msg local +
  # commitlint extends @commitlint/config-conventional). Comparação contra a
  # base do PR via merge-base do GitHub.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund
      - name: Lint commits
        run: |
          git fetch origin "${{ github.base_ref }}"
          npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

  # Push em main valida que o lib builda. Publish acontece só na tag.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund
      - name: Build lib
        run: npm run build:lib

  # Tag v*.*.* dispara build + publish no registry Figma.
  # Requer secret FIGMA_NPM_TOKEN em Settings → Secrets and variables → Actions.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      FIGMA_NPM_TOKEN: ${{ secrets.FIGMA_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configurar .npmrc (Figma registry)
        run: |
          cat > .npmrc <<EOF
          @clube-bravos:registry=https://registry.figma.com/npm/f76e40e8-0e2e-4018-a068-b7b7c18bceef/registry/
          @make-kits:registry=https://registry.figma.com/npm/f76e40e8-0e2e-4018-a068-b7b7c18bceef/registry/
          //registry.figma.com/npm/f76e40e8-0e2e-4018-a068-b7b7c18bceef/registry/:_authToken=${FIGMA_NPM_TOKEN}
          EOF
      - name: Install
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund
      - name: Build lib
        run: npm run build:lib
      - name: Publish @clube-bravos/design-system
        run: npm publish --ignore-scripts
      - name: Limpar .npmrc
        if: always()
        run: rm -f .npmrc
